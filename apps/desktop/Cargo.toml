[package]
name = "yt-remote-desktop"
version = "0.1.0"
edition = "2024"
default-run = "yt-remote-desktop"

[dependencies]
base64 = "0.22.1"
gpui-kit = "0.7.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[[bin]]
name = "yt-remote-desktop"
path = "src/main.rs"

[[bin]]
name = "yt-remote-media"
path = "src/bin/media.rs"
